name: Wochenmail

on:
  schedule:
    # GitHub Actions cron runs in UTC. 23:00 UTC on Sunday is 00:00 Monday in
    # winter (CET) and 01:00 Monday in summer (CEST), i.e. just after midnight
    # in Berlin. The working time zone is set below as well.
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wochenmail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Generate German locale
        run: sudo locale-gen de_DE.UTF-8

      - name: Send Wochenmail
        env:
          TZ: Europe/Berlin
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CALENDAR_URL: ${{ vars.CALENDAR_URL }}
        run: uv run .
